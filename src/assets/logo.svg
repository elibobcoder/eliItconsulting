<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B4FD9"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon: Abstract E monogram -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="8" height="40" rx="2" fill="url(#iconGradient)"/>
    <rect x="0" y="0" width="30" height="8" rx="2" fill="url(#iconGradient)"/>
    <rect x="0" y="16" width="24" height="8" rx="2" fill="url(#iconGradient)" opacity="0.85"/>
    <rect x="0" y="32" width="30" height="8" rx="2" fill="url(#iconGradient)" opacity="0.7"/>
  </g>

  <!-- Text: ELI IT CONSULTING -->
  <text x="48" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5" fill="currentColor">
    ELI <tspan fill="url(#iconGradient)">IT</tspan>
  </text>
  <text x="48" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="currentColor" opacity="0.65">
    CONSULTING
  </text>
</svg>
