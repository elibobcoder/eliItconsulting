<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 40" width="44" height="40">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Abstract V with speed lines -->
  <g transform="translate(0, 0)">
    <!-- Speed lines -->
    <path d="M0 12 L8 12" stroke="url(#iconGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M2 20 L12 20" stroke="url(#iconGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 28 L8 28" stroke="url(#iconGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- V Shape -->
    <path d="M14 8 L24 32 L34 8" fill="none" stroke="url(#iconGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Accent dot -->
    <circle cx="38" cy="10" r="3" fill="#3b82f6"/>
  </g>
</svg>
