<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="iconAccentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B4FD9"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon: Abstract E monogram, dark mark (adapts to theme via currentColor) with a single accent stripe -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="8" height="40" rx="2" fill="currentColor"/>
    <rect x="0" y="0" width="32" height="8" rx="2" fill="currentColor"/>
    <rect x="0" y="16" width="26" height="8" rx="2" fill="currentColor" opacity="0.82"/>
    <rect x="0" y="32" width="32" height="8" rx="2" fill="url(#iconAccentGradient)"/>
  </g>
</svg>
